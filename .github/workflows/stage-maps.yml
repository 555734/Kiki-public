name: Stage maps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - tools/export_stage_maps.*
      - .github/workflows/stage-maps.yml

permissions:
  contents: read

jobs:
  maps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-godot
        with:
          version: 4.7.2
      - name: Install project EOS runtime
        run: bash tools/install-eosg.sh linux
      - name: Import project
        run: |
          "$GODOT" --headless --editor --path . --import
      - name: Render all eight maps
        run: xvfb-run -a "$GODOT" --path . --rendering-method gl_compatibility tools/export_stage_maps.tscn -- --ci-skip-eos
      - name: Check complete PNG output
        run: |
          python3 - <<'PY'
          import json, pathlib, struct
          root = pathlib.Path('build/stage-maps')
          maps = json.loads((root / 'maps.json').read_text())['maps']
          assert {m['stage'] for m in maps} == {f'1-{n}' for n in range(1, 9)}
          for m in maps:
              data = (root / m['png']).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n'
              assert struct.unpack('>II', data[16:24]) == (m['width'], m['height'])
              assert m['clock_tick'] == 0
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coop-stage-maps
          path: build/stage-maps/
          if-no-files-found: error
