name: Platform Runner APK

on:
  push:
    branches:
      - prototype/platform-runner
    paths:
      - 'prototype-platform-runner/**'
      - '.github/workflows/platform-runner-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack standalone project
        working-directory: prototype-platform-runner
        run: unzip -o source.zip
      - name: Build debug APK
        working-directory: prototype-platform-runner
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare artifact
        working-directory: prototype-platform-runner
        run: cp app/build/outputs/apk/debug/app-debug.apk PlatformRunner.apk
      - uses: actions/upload-artifact@v4
        with:
          name: platform-runner-apk
          path: prototype-platform-runner/PlatformRunner.apk
          if-no-files-found: error
