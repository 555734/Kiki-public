name: Check an Apple key against the App Store Server API

# Read-only: asks Apple about a transaction that cannot exist, with the
# upload key in ASC_* secrets, and prints the HTTP statuses. 404 = the key
# can verify purchases; 401 = it cannot.
on:
  push:
    branches: [ccr-6f147420-l6xq7d]
    paths:
      - ".github/workflows/apple-key-check.yml"
      - "server/signaling/apple-check.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/signaling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upload key (ASC_*)
        env:
          APPLE_ASC_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: node apple-check.mjs || true
