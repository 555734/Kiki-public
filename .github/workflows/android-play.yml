name: Android Play AAB

# Store builds are intentionally manual. They use the permanent Play upload key
# and an operator-supplied version code; ordinary pushes continue to publish
# throwaway-signed APKs for Motorola and general device testing.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Google Play version code (must exceed the last uploaded build)"
        required: true
      version_name:
        description: "Public version name"
        required: true
        default: "0.9.10"
      submit_to_play:
        description: "Upload to Google Play's production track and send it for review"
        required: false
        default: false
        type: boolean
  # store-rehearsal.yml: the same signed bundle, built and thrown away. It
  # never sets submit_to_play, so nothing reaches Google Play.
  workflow_call:
    inputs:
      version_code:
        required: true
        type: string
      version_name:
        required: true
        type: string
      rehearsal:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  # 4.4.1 templates do not meet the 16 KB native-page requirement. Keep the
  # proven Motorola test APK workflow on 4.4.1, but build Play artifacts with
  # the current stable engine/templates.
  GODOT_VERSION: 4.7.2

jobs:
  build-play-bundle:
    runs-on: ubuntu-latest
    environment: google-play
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Versions, package ids, keys and pins agree before anything is built.
      - name: Release checks
        run: bash tools/release-check.sh

      - name: Install pinned EOSG for Linux host and Android target
        run: bash tools/install-eosg.sh linux android

      # The Play build is the one that MUST carry billing, so this is not
      # opt-in: an .aab without it would reach the store as a game that shows
      # a price and cannot take the money. If the plugin cannot be installed,
      # the build fails here rather than three screens into a player's evening.
      - name: Install the in-app purchase plugin
        run: bash tools/install-iap-plugins.sh android

      - name: Write EOS production credentials
        env:
          EOS_PRODUCT_ID: ${{ secrets.EOS_PRODUCT_ID }}
          EOS_SANDBOX_ID: ${{ secrets.EOS_SANDBOX_ID }}
          EOS_DEPLOYMENT_ID: ${{ secrets.EOS_DEPLOYMENT_ID }}
          EOS_CLIENT_ID: ${{ secrets.EOS_CLIENT_ID }}
          EOS_CLIENT_SECRET: ${{ secrets.EOS_CLIENT_SECRET }}
          EOS_BUILD_VERSION: ${{ inputs.version_name }}
        run: python3 tools/write-eos-credentials.py

      - name: Install build utilities
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          SDKMANAGER="$(find "${ANDROID_SDK_ROOT}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          [ -n "$SDKMANAGER" ] || { echo "Android SDK command-line tools are unavailable" >&2; exit 1; }
          set +o pipefail  # yes exits on SIGPIPE after sdkmanager finishes.
          yes | "$SDKMANAGER" "platform-tools" "build-tools;36.1.0" "platforms;android-36" >/dev/null

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable

      - name: Download Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          bash tools/godot-download.sh "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" /tmp/godot.zip
          unzip -q /tmp/godot.zip -d ~/godot
          chmod +x ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          bash tools/godot-download.sh "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" /tmp/templates.tpz
          unzip -q -j /tmp/templates.tpz 'templates/android_*' \
            -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Restore Play upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_BASE64" ] || { echo "ANDROID_UPLOAD_KEYSTORE_BASE64 is not configured" >&2; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/side-sky-upload.jks"
          chmod 600 "$RUNNER_TEMP/side-sky-upload.jks"

      - name: Configure Godot
        run: |
          set -euo pipefail
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF

      - name: Verify landscape and integrated stage assets
        run: |
          set -euo pipefail
          GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          "$GODOT" --headless --editor --import --path .
          "$GODOT" --headless --path . res://test/split_assets_probe.tscn
          "$GODOT" --headless --path . --fixed-fps 60 res://test/horror_stage_probe.tscn
          "$GODOT" --headless --path . --fixed-fps 60 res://test/skyward_ruins_probe.tscn
          "$GODOT" --headless --path . --fixed-fps 60 res://test/sea_stage_probe.tscn
          "$GODOT" --headless --path . --fixed-fps 60 res://test/swamp_stage_probe.tscn
          "$GODOT" --headless --path . --fixed-fps 60 res://test/desert_stage_probe.tscn
          "$GODOT" --headless --path . --fixed-fps 60 res://test/tower_stage_probe.tscn
          "$GODOT" --headless --path . --fixed-fps 60 res://test/cave_stage_probe.tscn
          "$GODOT" --headless --path . res://test/floating_controls_probe.tscn
          "$GODOT" --headless --path . --fixed-fps 60 res://test/royal_arena_probe.tscn
          "$GODOT" --headless --path . --fixed-fps 60 res://test/versus_probe.tscn
          "$GODOT" --headless --path . --fixed-fps 60 res://test/versus_touch_probe.tscn

      - name: Build signed Play bundle
        env:
          GODOT: /home/runner/godot/Godot_v4.7.2-stable_linux.x86_64
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/side-sky-upload.jks
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          BUILD_STAMP: play-${{ inputs.version_code }}-${{ github.sha }}
        run: bash tools/build-android-play.sh

      - name: Upload store artifact
        if: ${{ !inputs.rehearsal }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: side-sky-play-com.sasakiful.melos-${{ inputs.version_code }}
          path: build/android/side-sky-play.aab
          if-no-files-found: error

      # Release notes come from docs/store-listing.md, as for the App Store.
      - name: Prepare release notes
        if: inputs.submit_to_play
        run: |
          set -euo pipefail
          mkdir -p build/whatsnew
          python3 tools/release-notes.py ja > build/whatsnew/whatsnew-ja-JP
          test -s build/whatsnew/whatsnew-ja-JP

      - name: Check the Play service account is configured
        if: inputs.submit_to_play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ] || {
            echo "PLAY_SERVICE_ACCOUNT_JSON is not set: the bundle was built but not sent to Google Play" >&2
            exit 1
          }
          # Names what is wrong with the pasted key, never its values.
          python3 - <<'PY'
          import json, os, sys
          try:
              key = json.loads(os.environ["PLAY_SERVICE_ACCOUNT_JSON"])
          except Exception as err:
              sys.exit(f"PLAY_SERVICE_ACCOUNT_JSON is not valid JSON (pasted only part of the file?): {type(err).__name__}")
          problems = []
          if key.get("type") != "service_account":
              problems.append("type is not service_account")
          if key.get("client_email") != "melos-play-purchase-verifier@taiman-akinator.iam.gserviceaccount.com":
              problems.append("client_email is not the Play purchase-verifier account")
          if "-----BEGIN PRIVATE KEY-----" not in key.get("private_key", ""):
              problems.append("private_key is missing or incomplete")
          if problems:
              sys.exit("PLAY_SERVICE_ACCOUNT_JSON: " + "; ".join(problems))
          print("service account key looks complete")
          PY

      - name: Upload to Google Play (production, sent for review)
        if: inputs.submit_to_play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.sasakiful.melos
          releaseFiles: build/android/side-sky-play.aab
          releaseName: ${{ inputs.version_name }} (${{ inputs.version_code }})
          tracks: production
          status: completed
          whatsNewDirectory: build/whatsnew
