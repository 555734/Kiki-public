name: Android

# Builds both APKs and publishes them as a GitHub Release.
# The private source branch is recovery/unified; this workflow is intended to
# run automatically only after that snapshot is synced to Kiki-public/main.
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned EOSG for Linux host and Android target
        run: bash tools/install-eosg.sh linux android

      - name: Write EOS development credentials
        env:
          EOS_PRODUCT_ID: ${{ secrets.EOS_PRODUCT_ID }}
          EOS_SANDBOX_ID: ${{ secrets.EOS_SANDBOX_ID }}
          EOS_DEPLOYMENT_ID: ${{ secrets.EOS_DEPLOYMENT_ID }}
          EOS_CLIENT_ID: ${{ secrets.EOS_CLIENT_ID }}
          EOS_CLIENT_SECRET: ${{ secrets.EOS_CLIENT_SECRET }}
          EOS_BUILD_VERSION: ${{ github.sha }}
          EOS_ALLOW_PLACEHOLDER: "true"
        run: python3 tools/write-eos-credentials.py

      - name: Install xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable

      - name: Download Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          curl -sSL -o /tmp/godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          chmod +x ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          curl -sSL -o /tmp/templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j /tmp/templates.tpz 'templates/android_*' \
            -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          rm -f /tmp/godot.zip /tmp/templates.tpz

      - name: Create throwaway test signing key
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/side-sky-debug.keystore"
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=SIDE SKY CI Debug,O=GitHub Actions,C=US" >/dev/null
          chmod 600 "$KEYSTORE"
          echo "SIDE_SKY_CI_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Configure Godot editor settings
        run: |
          set -euo pipefail
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${SIDE_SKY_CI_KEYSTORE}"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project
        run: |
          export GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          "$GODOT" --headless --editor --import --path .

      - name: Run recovery smoke tests
        run: |
          set -euo pipefail
          export GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          "$GODOT" --headless --path . res://test/check_scripts.tscn
          "$GODOT" --headless --path . res://test/eos_contract_probe.tscn
          "$GODOT" --headless --path . res://test/touch_feel_probe.tscn
          "$GODOT" --headless --path . --fixed-fps 60 res://test/movement_probe.tscn
          "$GODOT" --headless --path . --fixed-fps 60 res://test/workshop_probe.tscn
          "$GODOT" --headless --path . --fixed-fps 60 res://test/stage_probe.tscn
          "$GODOT" --headless --path . --fixed-fps 60 res://test/skyward_ruins_probe.tscn
          "$GODOT" --headless --path . --fixed-fps 60 res://test/stage_menu_probe.tscn
          "$GODOT" --headless --path . --fixed-fps 60 res://test/versus_net_probe.tscn
          "$GODOT" --headless --path . --fixed-fps 60 res://test/versus_play_probe.tscn
          "$GODOT" --headless --path . --quit-after 240

      - name: Build Play AAB and both APKs
        run: |
          export GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          export ANDROID_HOME="${ANDROID_SDK_ROOT}"
          export KEYSTORE="${SIDE_SKY_CI_KEYSTORE}"
          bash tools/build-android.sh

      - name: Name this build
        id: name
        run: echo "tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: side-sky-android
          path: |
            build/android/*.aab
            build/android/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.name.outputs.tag }}"
          NOTES=$(cat <<'EOF'
          SIDE / SKY automated Android build.

          | file | purpose | renderer |
          |---|---|---|
          | `side-sky-play.aab` | Google Play upload format | Vulkan / Godot mobile |
          | `side-sky-vulkan.apk` | direct install | Vulkan / Godot mobile |
          | `side-sky-motorola-vulkan.apk` | **Motorola / PowerVR向け** direct install | Vulkan / Godot mobile |
          | `side-sky-gles3.apk` | compatibility fallback | GLES3 / Godot compatibility |

          Motorola端末では最初に`side-sky-motorola-vulkan.apk`を使用し、描画互換性の比較時だけGLES3版を使用してください。

          These files are signed with a throwaway key generated only for this
          workflow run. The AAB is the Google Play upload file format, but a
          production upload must be rebuilt with the app's stable Play upload
          key. APKs from different workflow runs may require the previous test
          build to be uninstalled before installation.
          EOF
          )
          gh release create "$TAG" build/android/*.aab build/android/*.apk \
            --title "SIDE / SKY $TAG" --notes "$NOTES" || \
          gh release upload "$TAG" build/android/*.aab build/android/*.apk --clobber
          echo "Release: $(gh release view "$TAG" --json url -q .url)"
