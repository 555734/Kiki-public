name: iOS

# Public CI has two modes:
# - normal push: require complete signing credentials and submit to App Store Connect
# - manual run with submit_to_app_store_connect=false: build the unsigned IPA fallback
on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "assets/**"
      - "project.godot"
      - "export_presets.cfg"
      - "tools/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      submit_to_app_store_connect:
        description: "Sign and upload to App Store Connect"
        required: false
        default: true
        type: boolean

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GODOT_VERSION: 4.4.1
  CODEMAGIC_CLI_VERSION: 0.67.0

jobs:
  build:
    runs-on: macos-latest
    env:
      APPLE_TEAM_ID: "6TGM565HX8"
      BUNDLE_ID: "com.sasakiful.sidesky"
      APP_VERSION: "0.2.3"
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      IOS_CERTIFICATE_PRIVATE_KEY: ${{ secrets.IOS_CERTIFICATE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/Library/Application Support/Godot/export_templates
          key: godot-ios-${{ env.GODOT_VERSION }}-stable

      - name: Download Godot and iOS export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          curl -sSL -o /tmp/godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          curl -sSL -o /tmp/templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j /tmp/templates.tpz 'templates/ios*' \
            -d "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          rm -f /tmp/godot.zip /tmp/templates.tpz

      - name: Select iOS distribution mode
        id: asc
        env:
          MANUAL_SUBMIT: ${{ inputs.submit_to_app_store_connect }}
        run: |
          set -euo pipefail
          requested=true
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${MANUAL_SUBMIT:-true}" != "true" ]; then
            requested=false
          fi

          if [ "$requested" = false ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Manual unsigned build requested."
            exit 0
          fi

          missing=()
          [ -n "${ASC_KEY_ID:-}" ] || missing+=(ASC_KEY_ID)
          [ -n "${ASC_ISSUER_ID:-}" ] || missing+=(ASC_ISSUER_ID)
          [ -n "${ASC_PRIVATE_KEY:-}" ] || missing+=(ASC_PRIVATE_KEY)
          [ -n "${IOS_CERTIFICATE_PRIVATE_KEY:-}" ] || missing+=(IOS_CERTIFICATE_PRIVATE_KEY)
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "App Store submission is required for this run, but signing secrets are missing: ${missing[*]}"
            echo "Create IOS_CERTIFICATE_PRIVATE_KEY once with an RSA private key and keep it stable across runs."
            exit 1
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Signing credentials found: fetching/creating the App Store certificate and provisioning profile, then signing locally and uploading."

      - name: Install Codemagic CLI signing tools
        if: steps.asc.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/codemagic-cli"
          "$RUNNER_TEMP/codemagic-cli/bin/pip" install --disable-pip-version-check "codemagic-cli-tools==${CODEMAGIC_CLI_VERSION}"
          echo "$RUNNER_TEMP/codemagic-cli/bin" >> "$GITHUB_PATH"
          if ! ruby -e 'require "xcodeproj"' >/dev/null 2>&1; then
            gem install --user-install xcodeproj --no-document
          fi

      - name: Build, sign, and upload to App Store Connect
        if: steps.asc.outputs.ready == 'true'
        run: |
          set -euo pipefail
          export GODOT="$HOME/godot/Godot.app/Contents/MacOS/Godot"
          [ -x "$GODOT" ] || { echo "Godot is not where expected:"; find ~/godot -maxdepth 3; exit 1; }
          xattr -dr com.apple.quarantine "$HOME/godot" 2>/dev/null || true
          chmod +x "$GODOT"
          xcodebuild -version
          bash tools/submit-ios-appstore.sh

      - name: Build the unsigned IPA fallback
        if: steps.asc.outputs.ready != 'true'
        run: |
          set -euo pipefail
          export GODOT="$HOME/godot/Godot.app/Contents/MacOS/Godot"
          [ -x "$GODOT" ] || { echo "Godot is not where expected:"; find ~/godot -maxdepth 3; exit 1; }
          xattr -dr com.apple.quarantine "$HOME/godot" 2>/dev/null || true
          chmod +x "$GODOT"
          xcodebuild -version
          bash tools/build-ios.sh

      - name: Collect build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            build/ios/**/*.log
            /tmp/xcodebuild_logs/*.log
          if-no-files-found: warn

      - name: Name unsigned fallback build
        if: steps.asc.outputs.ready != 'true' && success()
        id: name
        run: echo "tag=ios-build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned fallback artifact
        if: steps.asc.outputs.ready != 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: side-sky-ipa
          path: build/ios/side-sky-unsigned.ipa
          if-no-files-found: error

      - name: Publish unsigned fallback release
        if: steps.asc.outputs.ready != 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.name.outputs.tag }}"
          NOTES=$(cat <<'EOF'
          **Unsigned iOS build.** It will not install by tapping it.

          This run explicitly requested the unsigned fallback instead of an App Store Connect submission.
          EOF
          )
          gh release create "$TAG" build/ios/side-sky-unsigned.ipa \
            --title "SIDE / SKY $TAG (iOS)" --notes "$NOTES" || \
          gh release upload "$TAG" build/ios/side-sky-unsigned.ipa --clobber
          echo "Release: $(gh release view "$TAG" --json url -q .url)"

      - name: Summarize App Store Connect submission
        if: steps.asc.outputs.ready == 'true' && success()
        run: |
          {
            echo "## iOS submission accepted"
            echo
            echo "The locally signed build was uploaded to App Store Connect."
            echo "Apple still has to process it before it appears under Builds/TestFlight."
          } >> "$GITHUB_STEP_SUMMARY"
