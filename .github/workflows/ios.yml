name: iOS

# Push builds produce an unsigned IPA artifact. Signed App Store Connect
# uploads require an explicit manual run.
on:
  workflow_call:
    inputs:
      submit_to_app_store_connect:
        required: false
        default: false
        type: boolean
      rehearsal:
        description: "Take the signed App Store path but stop before uploading"
        required: false
        default: false
        type: boolean
      submit_for_review:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      submit_to_app_store_connect:
        description: "Sign and upload to App Store Connect"
        required: false
        default: false
        type: boolean
      rehearsal:
        description: "Take the signed App Store path but stop before uploading"
        required: false
        default: false
        type: boolean
      submit_for_review:
        description: "Also create the App Store version and submit it for review"
        required: false
        default: false
        type: boolean

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  CODEMAGIC_CLI_VERSION: 0.67.0

jobs:
  build:
    runs-on: macos-latest
    env:
      APPLE_TEAM_ID: "6TGM565HX8"
      BUNDLE_ID: "com.sasakiful.sidesky"
      APP_VERSION: "0.9.8"
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      IOS_CERTIFICATE_PRIVATE_KEY: ${{ secrets.IOS_CERTIFICATE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Before the 17-minute StoreKit build, not after it.
      - name: Release checks
        if: inputs.submit_to_app_store_connect
        run: bash tools/release-check.sh

      - name: Install pinned EOSG for macOS host and iOS target
        run: bash tools/install-eosg.sh macos ios

      - name: Write EOS development credentials
        env:
          EOS_PRODUCT_ID: ${{ secrets.EOS_PRODUCT_ID }}
          EOS_SANDBOX_ID: ${{ secrets.EOS_SANDBOX_ID }}
          EOS_DEPLOYMENT_ID: ${{ secrets.EOS_DEPLOYMENT_ID }}
          EOS_CLIENT_ID: ${{ secrets.EOS_CLIENT_ID }}
          EOS_CLIENT_SECRET: ${{ secrets.EOS_CLIENT_SECRET }}
          EOS_BUILD_VERSION: ${{ github.sha }}
          EOS_ALLOW_PLACEHOLDER: ${{ (inputs.submit_to_app_store_connect || inputs.rehearsal) && 'false' || 'true' }}
        run: python3 tools/write-eos-credentials.py

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/godot
            ~/Library/Application Support/Godot/export_templates
          key: godot-ios-${{ env.GODOT_VERSION }}-stable

      - name: Download Godot and iOS export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          bash tools/godot-download.sh "Godot_v${GODOT_VERSION}-stable_macos.universal.zip" /tmp/godot.zip
          unzip -q /tmp/godot.zip -d ~/godot
          bash tools/godot-download.sh "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" /tmp/templates.tpz
          unzip -q -j /tmp/templates.tpz 'templates/ios*' \
            -d "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          rm -f /tmp/godot.zip /tmp/templates.tpz

      - name: Select iOS distribution mode
        id: asc
        env:
          MANUAL_SUBMIT: ${{ inputs.submit_to_app_store_connect || inputs.rehearsal }}
        run: |
          set -euo pipefail
          requested="${MANUAL_SUBMIT:-false}"

          if [ "$requested" = false ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Manual unsigned build requested."
            exit 0
          fi

          missing=()
          [ -n "${ASC_KEY_ID:-}" ] || missing+=(ASC_KEY_ID)
          [ -n "${ASC_ISSUER_ID:-}" ] || missing+=(ASC_ISSUER_ID)
          [ -n "${ASC_PRIVATE_KEY:-}" ] || missing+=(ASC_PRIVATE_KEY)
          [ -n "${IOS_CERTIFICATE_PRIVATE_KEY:-}" ] || missing+=(IOS_CERTIFICATE_PRIVATE_KEY)
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "App Store submission is required for this run, but signing secrets are missing: ${missing[*]}"
            echo "Create IOS_CERTIFICATE_PRIVATE_KEY once with an RSA private key and keep it stable across runs."
            exit 1
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Signing credentials found: fetching/creating the App Store certificate and provisioning profile, then signing locally and uploading."

      # Built from source, not downloaded: there has never been a prebuilt
      # Godot 4 release of this plugin. See tools/build-ios-iap-plugin.sh.
      # Only the submitting build needs it -- the unsigned fallback is a
      # packaging proof, and StoreKit costs several minutes of a macOS runner.
      - name: Build and install the StoreKit plugin
        if: steps.asc.outputs.ready == 'true'
        env:
          IOS_GODOT_TAG: ${{ env.GODOT_VERSION }}-stable
        run: |
          set -euo pipefail
          # Homebrew Python is externally managed; install scons in a venv.
          python3 -m venv "$RUNNER_TEMP/scons-venv"
          "$RUNNER_TEMP/scons-venv/bin/pip" install --quiet --disable-pip-version-check scons==4.11.1
          echo "$RUNNER_TEMP/scons-venv/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/scons-venv/bin:$PATH"
          bash tools/install-iap-plugins.sh ios

      - name: Install Codemagic CLI signing tools
        if: steps.asc.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/codemagic-cli"
          "$RUNNER_TEMP/codemagic-cli/bin/pip" install --disable-pip-version-check "codemagic-cli-tools==${CODEMAGIC_CLI_VERSION}"
          echo "$RUNNER_TEMP/codemagic-cli/bin" >> "$GITHUB_PATH"
          if ! ruby -e 'require "xcodeproj"' >/dev/null 2>&1; then
            gem install --user-install xcodeproj -v 1.28.1 --no-document
          fi

      - name: Build, sign, and upload to App Store Connect
        if: steps.asc.outputs.ready == 'true'
        env:
          SKIP_UPLOAD: ${{ inputs.rehearsal && '1' || '0' }}
        run: |
          set -euo pipefail
          export GODOT="$HOME/godot/Godot.app/Contents/MacOS/Godot"
          [ -x "$GODOT" ] || { echo "Godot is not where expected:"; find ~/godot -maxdepth 3; exit 1; }
          xattr -dr com.apple.quarantine "$HOME/godot" 2>/dev/null || true
          chmod +x "$GODOT"
          xcodebuild -version
          bash tools/release-check.sh
          VENV="$RUNNER_TEMP/codemagic-cli" bash tools/check-codemagic-cli.sh
          SUBMIT_FOR_REVIEW="${{ inputs.submit_for_review && 'true' || 'false' }}" \
            bash tools/submit-ios-appstore.sh

      - name: Build the unsigned IPA fallback
        if: steps.asc.outputs.ready != 'true'
        run: |
          set -euo pipefail
          export GODOT="$HOME/godot/Godot.app/Contents/MacOS/Godot"
          [ -x "$GODOT" ] || { echo "Godot is not where expected:"; find ~/godot -maxdepth 3; exit 1; }
          xattr -dr com.apple.quarantine "$HOME/godot" 2>/dev/null || true
          chmod +x "$GODOT"
          xcodebuild -version
          bash tools/build-ios.sh

      - name: Collect build logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-build-logs
          path: |
            build/ios/**/*.log
            /tmp/xcodebuild_logs/*.log
          if-no-files-found: warn

      - name: Upload unsigned fallback artifact
        if: steps.asc.outputs.ready != 'true' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: side-sky-ipa
          path: build/ios/side-sky-unsigned.ipa
          if-no-files-found: error

      - name: Summarize App Store Connect submission
        if: steps.asc.outputs.ready == 'true' && success() && !inputs.rehearsal
        run: |
          {
            echo "## iOS submission accepted"
            echo
            echo "The locally signed build was uploaded to App Store Connect."
            echo "Apple processing and TestFlight availability were verified for this exact build."
          } >> "$GITHUB_STEP_SUMMARY"
