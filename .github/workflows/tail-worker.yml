name: Tail signalling worker logs

# Read-only: records the Worker's live log for 15 minutes into this job's
# output, so a restore attempted on a phone meanwhile shows what Apple said.
# Runs when this file or server/signaling/TAIL_REQUEST changes on the branch.
on:
  push:
    branches: [ccr-6f147420-l6xq7d]
    paths:
      - "server/signaling/TAIL_REQUEST"
      - ".github/workflows/tail-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tail for 15 minutes
        working-directory: server/signaling
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          timeout 900 npx --yes wrangler@4 tail side-sky-signalling --format pretty || true
