name: Mobile Android + iOS

on:
  push:
    branches: [main, recovery/unified]
    paths:
      - "src/**"
      - "assets/**"
      - "project.godot"
      - "export_presets.cfg"
      - "tools/**"
      - "test/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      submit_ios:
        description: "Sign and upload iOS to App Store Connect"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  android:
    uses: ./.github/workflows/android.yml
    secrets: inherit

  ios:
    uses: ./.github/workflows/ios.yml
    with:
      # Combined push builds prove iOS packaging without silently shipping an
      # app that still has CI-only EOS credentials. Store submission is an
      # explicit manual action and remains fail-closed on missing EOS secrets.
      submit_to_app_store_connect: true
    secrets: inherit
