name: Mobile Android + iOS

on:
  push:
    branches: [main, recovery/unified]
    paths:
      - "src/**"
      - "assets/**"
      - "project.godot"
      - "export_presets.cfg"
      - "tools/**"
      - "test/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      submit_ios:
        description: "Sign and upload iOS to App Store Connect"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  android:
    uses: ./.github/workflows/android.yml
    secrets: inherit

  ios:
    uses: ./.github/workflows/ios.yml
    with:
      # One-time explicitly requested App Store Connect submission on this push.
      # Restore the standard manual-only behavior after this run completes.
      submit_to_app_store_connect: ${{ inputs.submit_ios || github.event_name == 'push' }}
    secrets: inherit
