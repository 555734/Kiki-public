name: Deploy signalling worker

# The Cloudflare Worker behind online play and purchase verification
# (server/signaling). Tests first; the Worker's own secrets (signing key,
# App Store Connect key, ...) live in Cloudflare and are kept by a deploy.
on:
  push:
    branches: [main, ccr-6f147420-l6xq7d]
    paths:
      - "server/signaling/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/signaling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Entitlement tests
        run: node entitlement.test.mjs
      - name: Install the App Store Server API key
        # A dedicated In-App Purchase key (APPLE_IAP_*) when there is one;
        # otherwise the App Store Connect upload key (ASC_*), which the owner
        # approved for this and which apple-key-check.yml showed the Server
        # API accepts (404 for an unknown transaction, not 401).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APPLE_IAP_KEY: ${{ secrets.APPLE_IAP_KEY || secrets.ASC_PRIVATE_KEY }}
          APPLE_IAP_KEY_ID: ${{ secrets.APPLE_IAP_KEY_ID || secrets.ASC_KEY_ID }}
          APPLE_IAP_ISSUER_ID: ${{ secrets.APPLE_IAP_ISSUER_ID || secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "$APPLE_IAP_KEY" ] || [ -z "$APPLE_IAP_KEY_ID" ] || [ -z "$APPLE_IAP_ISSUER_ID" ]; then
            echo "no Apple key in the secrets; leaving the Worker's as it is"
            exit 0
          fi
          printf '%s' "$APPLE_IAP_KEY" | npx --yes wrangler@4 secret put APPLE_ASC_KEY
          printf '%s' "$APPLE_IAP_KEY_ID" | npx --yes wrangler@4 secret put APPLE_ASC_KEY_ID
          printf '%s' "$APPLE_IAP_ISSUER_ID" | npx --yes wrangler@4 secret put APPLE_ASC_ISSUER_ID
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN secret is missing" >&2; exit 1; }
          npx --yes wrangler@4 deploy
