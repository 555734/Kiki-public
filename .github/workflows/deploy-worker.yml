name: Deploy signalling worker

# The Cloudflare Worker behind online play and purchase verification
# (server/signaling). Tests first; the Worker's own secrets (signing key,
# App Store Connect key, ...) live in Cloudflare and are kept by a deploy.
on:
  push:
    branches: [main, ccr-6f147420-l6xq7d]
    paths:
      - "server/signaling/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/signaling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Entitlement tests
        run: node entitlement.test.mjs
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN secret is missing" >&2; exit 1; }
          npx --yes wrangler@4 deploy
