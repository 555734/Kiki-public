; Ceilings for tools/perf_probe.gd --budget: the peak draw calls and object
; count over the probe's walk through each stage, under the compatibility
; renderer at 1280x720. Both depend on the scene, not the GPU, so CI measures
; the same numbers a phone draws (tools/perf-gate.sh).
