name="Android"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="test/*, build/*, server/*, tools/*, docs/*, dist/*, ci/*, *.md, *.sh, *.py, *.ps1, ios/*"
export_path="build/android/side-sky-vulkan.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

