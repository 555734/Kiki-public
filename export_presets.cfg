; Export presets for メロスゲーム.
;
; permissions/internet is on for both Android builds. Godot 4 does not add it
; just because a project opens a socket, and without it the app cannot reach the
; relay OR another device on the same Wi-Fi -- online play was simply dead on
; Android and nothing in the game could say why.
;
; exclude_filter carries more than test/*. The relay server lives in this
; repository, and once someone runs `npm install` there Godot happily packs
; whatever it recognises out of node_modules into the shipped game -- 54 stray
; JavaScript package files were inside the Android build before this was
; noticed. Nothing outside src/ and assets/ belongs in the pack.
;
; No credentials live here on purpose. Signing keys, keystore passwords and the
; Apple team ID are per-developer, so set them in the editor (Project > Export)
; or via the environment; Godot reads the keystore variables below from your
; editor settings, not from this file.
;
; The two Android presets differ only in package id and label. Which renderer a
; build uses is a *project* setting, not a preset option, so the build scripts
; flip rendering_method.mobile between them.
; Shipping both is deliberate: the Vulkan build is faster on modern hardware,
; the GLES3 one runs on far more devices. They install side by side so they can
; be compared on the same phone.
;
; The iOS preset needs macOS and Xcode, so signed/TestFlight builds use
; Codemagic. The repository preset intentionally keeps placeholder identity
; values; tools/ios-identity.sh injects the real team, bundle id, version and
; build number at build time.

