<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Momentum Run</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8fd3ff;touch-action:none;overscroll-behavior:none;font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none;color:white;text-shadow:0 2px 4px #0008;font-weight:800}
#tip{position:absolute;left:50%;top:12px;transform:translateX(-50%);font-size:clamp(12px,2vw,18px);white-space:nowrap;opacity:.85}
.controls{position:absolute;inset:0;pointer-events:none}
.btn{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid #fff8;background:#13223566;color:#fff;font-weight:900;backdrop-filter:blur(2px);pointer-events:auto;touch-action:none;box-shadow:inset 0 0 0 2px #0002}
.btn.active{transform:scale(.94);background:#ffffff55}
#left{left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:min(17vw,110px);height:min(17vw,110px);font-size:min(8vw,48px)}
#right{left:calc(max(18px,env(safe-area-inset-left)) + min(18vw,120px));bottom:max(18px,env(safe-area-inset-bottom));width:min(17vw,110px);height:min(17vw,110px);font-size:min(8vw,48px)}
#down{left:calc(max(18px,env(safe-area-inset-left)) + min(9vw,60px));bottom:calc(max(18px,env(safe-area-inset-bottom)) + min(17vw,110px));width:min(14vw,88px);height:min(14vw,88px);font-size:min(6vw,38px)}
#jump{right:max(18px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));width:min(20vw,128px);height:min(20vw,128px);font-size:min(3vw,22px)}
#run{right:calc(max(18px,env(safe-area-inset-right)) + min(21vw,138px));bottom:max(20px,env(safe-area-inset-bottom));width:min(16vw,102px);height:min(16vw,102px);font-size:min(2.6vw,19px)}
#reset{position:absolute;right:12px;top:10px;border:0;border-radius:999px;background:#14213188;color:#fff;padding:8px 13px;font-weight:800;pointer-events:auto}
@media (max-height:430px){#tip{font-size:12px}.btn{opacity:.82}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div id="tip">RUNを押しながら加速 → 着地直後に連続ジャンプで三段ジャンプ</div></div>
<div class="controls">
  <div class="btn" id="left">◀</div><div class="btn" id="right">▶</div><div class="btn" id="down">▼</div>
  <div class="btn" id="run">RUN</div><div class="btn" id="jump">JUMP</div>
  <button id="reset">RESET</button>
</div>
<script src="game.js"></script>
</body>
</html>
